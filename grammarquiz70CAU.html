<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng Ôn Ngữ Pháp - Gen Z Style</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            purple: '#9d4edd',
                            pink: '#ff70a6',
                            yellow: '#ff9770',
                            blue: '#4cc9f0',
                            dark: '#10002b'
                        }
                    },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'bounce-slow': 'bounce 3s infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Styles for Gen Z Vibe */
        body {
            background-color: #f8f9fa;
            background-image: 
                radial-gradient(at 0% 0%, hsla(280,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(328,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(190,100%,70%,1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            border-radius: 24px;
        }

        .neo-brutalism {
            border: 3px solid #10002b;
            box-shadow: 4px 4px 0px #10002b;
            transition: all 0.2s ease;
        }

        .neo-brutalism:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #10002b;
        }

        .neo-brutalism:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #10002b;
        }

        .option-label {
            cursor: pointer;
            border: 2px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        
        .option-label:hover {
            border-color: #9d4edd;
            background-color: #faf5ff;
        }

        input[type="radio"]:checked + .option-label {
            border-color: #9d4edd;
            background-color: #f3e8ff;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(157, 78, 221, 0.2);
        }

        .correct-answer {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
            font-weight: bold;
        }

        .wrong-answer {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .timer-warning {
            animation: pulse-red 1s infinite;
            color: #ef4444;
            font-weight: bold;
        }

        @keyframes pulse-red {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Hide scrollbar for clean look but keep functionality */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        #explanation-modal {
            display: none;
        }
        #explanation-modal.active {
            display: flex;
        }
    </style>
</head>
<body class="text-brand-dark min-h-screen p-4 md:p-8 flex flex-col font-sans">

    <!-- Header Area -->
    <header class="max-w-4xl mx-auto w-full mb-8 sticky top-4 z-50">
        <div class="glass-panel p-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-brand-purple to-brand-pink flex items-center justify-center text-white text-xl shadow-lg transform -rotate-6">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-display font-bold text-2xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-brand-purple to-brand-pink">
                        TỔNG ÔN NGỮ PHÁP
                    </h1>
                    <p class="text-sm text-gray-600 font-medium">✨ Slay your grammar ✨</p>
                </div>
            </div>

            <!-- Timer Dashboard -->
            <div id="timer-container" class="flex items-center gap-4 neo-brutalism bg-white px-5 py-2 rounded-xl">
                <i class="fa-regular fa-clock text-xl text-brand-purple"></i>
                <div class="font-display text-2xl font-bold font-mono tracking-wider w-24 text-center" id="time">60:00</div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto w-full flex-grow relative pb-20">
        
        <!-- Welcome / Start Screen -->
        <div id="start-screen" class="glass-panel p-8 md:p-12 text-center flex flex-col items-center justify-center min-h-[60vh]">
            <span class="text-6xl mb-6 inline-block animate-bounce-slow">🚀</span>
            <h2 class="font-display text-4xl md:text-5xl font-bold mb-4">Sẵn sàng chiến chưa?</h2>
            <p class="text-lg text-gray-600 mb-8 max-w-lg">
                Bài test gồm 70 câu hỏi ngữ pháp cực "cuốn". Bạn có 60 phút để hoàn thành. Hãy tập trung cao độ nhé!
            </p>
            <button id="start-btn" class="neo-brutalism bg-brand-yellow px-8 py-4 rounded-2xl font-bold text-xl uppercase tracking-wider text-brand-dark hover:bg-brand-pink hover:text-white transition-colors">
                Let's Go! 🔥
            </button>
        </div>

        <!-- Quiz Container (Hidden initially) -->
        <div id="quiz-container" class="hidden space-y-6">
            <!-- Questions will be injected here by JavaScript -->
        </div>

        <!-- Submit Button (Hidden initially) -->
        <div id="submit-container" class="hidden mt-10 text-center">
            <button id="submit-btn" class="neo-brutalism bg-brand-blue px-10 py-4 rounded-2xl font-bold text-xl uppercase tracking-wider text-white hover:bg-brand-purple transition-colors inline-flex items-center gap-3">
                <i class="fa-solid fa-paper-plane"></i> Nộp Bài Ngay!
            </button>
        </div>

        <!-- Results Screen (Hidden initially) -->
        <div id="results-screen" class="hidden glass-panel p-8 text-center">
            <div id="score-icon" class="text-7xl mb-4">🏆</div>
            <h2 class="font-display text-4xl font-bold mb-2">Kết quả của bạn</h2>
            <div class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-purple to-brand-pink my-6">
                <span id="score-display">0</span>/70
            </div>
            <p id="feedback-message" class="text-xl font-medium mb-8 text-gray-700"></p>
            <button id="review-btn" class="neo-brutalism bg-white px-6 py-3 rounded-xl font-bold text-lg hover:bg-gray-100 transition-colors inline-flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> Xem lại chi tiết
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 text-center">
        <div class="inline-flex items-center justify-center gap-2 px-6 py-2 rounded-full glass-panel font-medium text-sm text-gray-600 shadow-sm border border-gray-200">
            <span>✨ Idea for Design:</span>
            <span class="font-bold text-brand-purple">Mr Hoa Van!</span>
        </div>
    </footer>

    <!-- Explanation Modal -->
    <div id="explanation-modal" class="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[80vh] overflow-hidden flex flex-col shadow-2xl transform transition-all neo-brutalism">
            <div class="p-6 bg-gradient-to-r from-brand-purple to-brand-pink text-white flex justify-between items-center">
                <h3 class="font-display font-bold text-2xl flex items-center gap-2">
                    <i class="fa-solid fa-lightbulb text-yellow-300"></i> Giải thích chi tiết
                </h3>
                <button id="close-modal" class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 md:p-8 overflow-y-auto">
                <p id="modal-question-text" class="font-medium text-lg mb-4 text-gray-700 pb-4 border-b border-gray-100"></p>
                <div id="modal-explanation-content" class="text-gray-800 leading-relaxed text-lg">
                    <!-- Content injected here -->
                </div>
            </div>
            <div class="p-4 bg-gray-50 border-t border-gray-100 text-center">
                <button id="close-modal-btn" class="neo-brutalism bg-brand-dark text-white px-8 py-2 rounded-xl font-bold hover:bg-brand-purple transition-colors">
                    Đã hiểu! 👍
                </button>
            </div>
        </div>
    </div>

    <!-- Audio elements for feedback -->
    <audio id="sound-tick" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-alarm" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-success" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Data Structure for Questions
        // Contains the question text, options, correct answer index (0-3), and explanation.
        const quizData = [
            {
                id: 1,
                question: "More than 5,000 runners participated in the Da Nang Charity Marathon, raising a record ____ of money for local hospitals.",
                options: ["scale", "number", "range", "amount"],
                correct: 3,
                explanation: "<strong>'amount of money'</strong> là cụm từ cố định nghĩa là 'khoản tiền'. 'Number' dùng cho danh từ đếm được, 'scale' (quy mô), 'range' (phạm vi) không phù hợp ngữ cảnh này."
            },
            {
                id: 2,
                question: "This project is expected to bring significant ____ to passenger experience and safety.",
                options: ["improved", "improve", "improvingly", "improvements"],
                correct: 3,
                explanation: "Sau tính từ 'significant' (đáng kể) cần một danh từ. <strong>'improvements'</strong> (những sự cải thiện) là danh từ số nhiều phù hợp ngữ nghĩa."
            },
            {
                id: 3,
                question: "In recent years, our city has invested heavily in flood-prevention infrastructure. ____ damage from seasonal storms has decreased considerably.",
                options: ["Because", "Therefore", "Moreover", "However"],
                correct: 1,
                explanation: "Câu trước nói về nguyên nhân (đầu tư mạnh vào hạ tầng), câu sau là kết quả (thiệt hại giảm). Do đó cần trạng từ chỉ kết quả <strong>'Therefore'</strong> (Vì vậy)."
            },
            {
                id: 4,
                question: "Customers purchasing the premium package will gain access to our ____.",
                options: ["exclusive networking platform", "exclusive platform networking", "networking exclusive platform", "platform networking exclusive"],
                correct: 0,
                explanation: "Trật tự từ trong cụm danh từ: Tính từ (exclusive) + Danh từ phụ bổ nghĩa (networking) + Danh từ chính (platform) -> <strong>'exclusive networking platform'</strong> (nền tảng kết nối độc quyền)."
            },
            {
                id: 5,
                question: "Several recommendations ____ by experts specializing in public health policy during the conference.",
                options: ["presented", "was presented", "presenting", "were presented"],
                correct: 3,
                explanation: "Chủ ngữ 'Several recommendations' (Nhiều đề xuất) là danh từ số nhiều và là vật nên cần thể bị động số nhiều. <strong>'were presented'</strong> (được trình bày) là đáp án đúng."
            },
            {
                id: 6,
                question: "Entrepreneurs ____ innovative healthcare technologies received funding from international investors.",
                options: ["developing", "developed", "develop", "development"],
                correct: 0,
                explanation: "Rút gọn mệnh đề quan hệ chủ động. Đầy đủ: 'Entrepreneurs who develop...'. Rút gọn thành V-ing: <strong>'developing'</strong> (những doanh nhân phát triển...)."
            },
            {
                id: 7,
                question: "Participants in Bright English Center program can choose classes at different ____ based on their proficiency.",
                options: ["numbers", "levels", "degrees", "extents"],
                correct: 1,
                explanation: "Dựa vào ngữ cảnh 'based on their proficiency' (dựa trên năng lực), từ phù hợp nhất để đi với 'classes' là <strong>'levels'</strong> (các trình độ khác nhau)."
            },
            {
                id: 8,
                question: "____ participant in the Young Entrepreneurs Summit will receive a certificate and networking opportunities.",
                options: ["Each", "Some", "Several", "All"],
                correct: 0,
                explanation: "Danh từ 'participant' (người tham gia) đang ở dạng số ít đếm được. Trong các từ đã cho, chỉ có <strong>'Each'</strong> (Mỗi) cộng với danh từ số ít đếm được."
            },
            {
                id: 9,
                question: "Visitors to the Tokyo Digital Art Museum, ____ features interactive exhibits, often spend several hours exploring its galleries.",
                options: ["where", "what", "that", "which"],
                correct: 3,
                explanation: "Đại từ quan hệ thay thế cho danh từ chỉ vật 'Tokyo Digital Art Museum' trong mệnh đề quan hệ không xác định (có dấu phẩy) làm chủ ngữ cho động từ 'features' là <strong>'which'</strong>. Không dùng 'that' sau dấu phẩy."
            },
            {
                id: 10,
                question: "The exhibition features a ____ created by award-winning artists from around the world.",
                options: ["digital art collection", "digital collection art", "art digital collection", "collection art digital"],
                correct: 0,
                explanation: "Trật tự cụm danh từ: Tính từ (digital) + Danh từ phụ (art) + Danh từ chính (collection) -> <strong>'digital art collection'</strong> (bộ sưu tập nghệ thuật kỹ thuật số)."
            },
            {
                id: 11,
                question: "Only a small ____ of programming experience is required to join our six-week AI course.",
                options: ["amount", "degree", "extent", "number"],
                correct: 0,
                explanation: "'experience' (kinh nghiệm) trong ngữ cảnh này là danh từ không đếm được. Ta dùng cụm <strong>'a small amount of'</strong> (một lượng nhỏ)."
            },
            {
                id: 12,
                question: "Visitors ____ the Ancient Silk Road Exhibition can access interactive displays using their devices.",
                options: ["are exploring", "exploring", "explored", "explore"],
                correct: 1,
                explanation: "Rút gọn mệnh đề quan hệ mang nghĩa chủ động. Đầy đủ: 'Visitors who explore...'. Rút gọn bằng V-ing: <strong>'exploring'</strong>."
            },
            {
                id: 13,
                question: "The documentary provides valuable ____ about the challenges facing endangered wildlife species worldwide.",
                options: ["information", "informed", "inform", "informative"],
                correct: 0,
                explanation: "Sau tính từ 'valuable' cần một danh từ. <strong>'information'</strong> (thông tin) là danh từ phù hợp. 'Provide information about' (cung cấp thông tin về)."
            },
            {
                id: 14,
                question: "____ residents of Valencia gathered in the city center to celebrate the opening of a new public library.",
                options: ["Much", "Another", "Many", "Every"],
                correct: 2,
                explanation: "'residents' (cư dân) là danh từ đếm được số nhiều. Chỉ có <strong>'Many'</strong> (Nhiều) đi được với danh từ đếm được số nhiều."
            },
            {
                id: 15,
                question: "The flight to Bali was fully booked, ____ the airline added another service for the following day.",
                options: ["for", "so", "or", "yet"],
                correct: 1,
                explanation: "Mệnh đề trước chỉ nguyên nhân (chuyến bay đã kín chỗ), mệnh đề sau chỉ kết quả (hãng hàng không thêm chuyến mới). Liên từ phù hợp là <strong>'so'</strong> (vì vậy)."
            },
            {
                id: 16,
                question: "____ registration fees increased slightly this year, the Hanoi International Book Fair attracted record attendance.",
                options: ["Although", "Because", "However", "Despite"],
                correct: 0,
                explanation: "Hai mệnh đề mang nghĩa tương phản (phí tăng NHƯNG thu hút lượng người kỷ lục). Chỗ trống cần liên từ đi với một mệnh đề (S + V). <strong>'Although'</strong> (Mặc dù) là phù hợp. ('Despite' đi với N/V-ing)."
            },
            {
                id: 17,
                question: "____ several international speakers canceled their flights, the conference schedule had to be adjusted at short notice.",
                options: ["However", "Because", "Although", "Therefore"],
                correct: 1,
                explanation: "Mệnh đề chứa chỗ trống là nguyên nhân (vài diễn giả hủy chuyến), mệnh đề chính là kết quả (lịch trình phải điều chỉnh). Liên từ chỉ nguyên nhân đi với mệnh đề là <strong>'Because'</strong> (Bởi vì)."
            },
            {
                id: 18,
                question: "Travelers can explore local culture through our ____, which covers several historic landmarks.",
                options: ["tour walking guided", "walking guided tour", "guided tour walking", "guided walking tour"],
                correct: 3,
                explanation: "Trật tự cụm danh từ chỉ một loại hình du lịch: Phân từ hai làm tính từ (guided) + V-ing làm tính từ phân loại (walking) + Danh từ chính (tour) -> <strong>'guided walking tour'</strong> (tour đi bộ có hướng dẫn)."
            },
            {
                id: 19,
                question: "____ medical experts interviewed by CNN expressed concern about declining vaccination rates among children.",
                options: ["Much", "Each", "Every", "Several"],
                correct: 3,
                explanation: "'medical experts' là danh từ đếm được số nhiều. Trong các đáp án, chỉ có <strong>'Several'</strong> (Một vài) đi với danh từ số nhiều."
            },
            {
                id: 20,
                question: "The museum offers free admission on weekends, ____ many families choose to visit during that time.",
                options: ["so", "or", "for", "yet"],
                correct: 0,
                explanation: "Quan hệ nguyên nhân - kết quả. Bảo tàng miễn phí (nguyên nhân) -> nhiều gia đình đến thăm (kết quả). Dùng liên từ <strong>'so'</strong> (vì vậy)."
            },
            {
                id: 21,
                question: "The exhibition, ____ features rare photographs from Antarctica, will remain open until the end of August.",
                options: ["that", "what", "which", "where"],
                correct: 2,
                explanation: "Thay thế cho 'The exhibition' (vật) làm chủ ngữ trong mệnh đề quan hệ không xác định (có dấu phẩy). Dùng <strong>'which'</strong>. Không dùng 'that' sau dấu phẩy."
            },
            {
                id: 22,
                question: "The year ____ Netflix released its first major Korean original series marked a turning point in global entertainment.",
                options: ["who", "when", "which", "where"],
                correct: 1,
                explanation: "Thay thế cho danh từ chỉ thời gian 'The year' (Năm mà...), ta dùng trạng từ quan hệ <strong>'when'</strong>."
            },
            {
                id: 23,
                question: "The new scholarship program aims to increase ____ in STEM subjects among female students.",
                options: ["participatory", "participant", "participation", "participate"],
                correct: 2,
                explanation: "Sau động từ 'increase' (gia tăng) cần một danh từ làm tân ngữ. 'participation' (sự tham gia) là phù hợp nhất về nghĩa. 'increase participation' (gia tăng sự tham gia)."
            },
            {
                id: 24,
                question: "The company's latest advertising campaign proved highly ____ in attracting younger consumers.",
                options: ["effect", "effectively", "effective", "effectiveness"],
                correct: 2,
                explanation: "Cấu trúc: prove + (adv) + adj (chứng tỏ ra sao). Trạng từ 'highly' bổ nghĩa cho tính từ cần điền. <strong>'effective'</strong> (hiệu quả) là tính từ."
            },
            {
                id: 25,
                question: "____ residents welcomed the city's decision to expand bicycle lanes throughout downtown districts.",
                options: ["Much", "Every", "Many", "Another"],
                correct: 2,
                explanation: "'residents' (cư dân) là danh từ số nhiều. Chỉ có <strong>'Many'</strong> đi với danh từ số nhiều đếm được."
            },
            {
                id: 26,
                question: "Guests staying at Ocean Breeze Resort can enjoy access to our ____ throughout their visit.",
                options: ["beach area private", "private area beach", "private beach area", "area beach private"],
                correct: 2,
                explanation: "Trật tự cụm danh từ: Tính từ miêu tả (private) + Danh từ phụ chỉ loại hình (beach) + Danh từ chính (area) -> <strong>'private beach area'</strong> (khu vực bãi biển riêng tư)."
            },
            {
                id: 27,
                question: "Students participating in the robotics competition ____ intensive training sessions every weekend.",
                options: ["to attend", "attending", "attended", "attend"],
                correct: 3,
                explanation: "Câu thiếu động từ chính (Students... là chủ ngữ, participating... bổ nghĩa cho chủ ngữ). 'every weekend' chỉ thói quen hiện tại. Động từ chính chia thì hiện tại đơn số nhiều: <strong>'attend'</strong>."
            },
            {
                id: 28,
                question: "Our language center offers a ____ designed for students preparing for international examinations.",

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                // Warning at 5 minutes
                if (timeLeft === 300) {
                    timerContainer.classList.add('timer-warning');
                    timerContainer.classList.remove('bg-white');
                    timerContainer.classList.add('bg-red-50');
                    playSound(soundAlarm);
                }

                // Tick sound every second in last 10 seconds
                if (timeLeft <= 10 && timeLeft > 0) {
                    playSound(soundTick);
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoSubmit();
                }
            }, 1000);
        }

            const minutes = Math.floor(timeLeft / 60);

                        <div class="relative w-full">
                            <input type="radio" name="q${index}" id="q${index}-opt${optIndex}" value="${optIndex}" class="peer hidden" onchange="handleSelect(${index}, ${optIndex})">
                            <label for="q${index}-opt${optIndex}" id="label-q${index}-opt${optIndex}" class="option-label flex items-center p-4 rounded-xl w-full bg-white text-gray-800 text-lg">
                                <span class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 text-gray-500 font-bold mr-4 font-display peer-checked:bg-brand-purple peer-checked:text-white transition-colors">
                                    ${labels[optIndex]}
                                </span>
                                <span>${opt}</span>
                            </label>
                        </div>
                    `;
                });

                questionBlock.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                        <div class="flex-shrink-0">
                            <span class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand-dark text-white font-display font-bold text-xl neo-brutalism">
                                ${q.id}
                            </span>
                        </div>
                        <h3 class="text-xl md:text-2xl font-medium leading-relaxed pt-2">
                            ${q.question}
                        </h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 ml-0 md:ml-16">
                        ${optionsHtml}
                    </div>
                    
                    <!-- Feedback Section (Hidden initially) -->
                    <div id="feedback-${index}" class="hidden mt-6 ml-0 md:ml-16 p-4 rounded-xl">
                        <div class="flex justify-between items-center mb-2">
                            <span id="status-${index}" class="font-bold text-lg flex items-center gap-2"></span>
                            <button onclick="showExplanation(${index})" class="text-brand-purple font-medium hover:underline flex items-center gap-1">
                                <i class="fa-solid fa-book-open"></i> Xem giải thích chi tiết
                            </button>
                        </div>
                    </div>
                `;
                
                quizContainer.appendChild(questionBlock);
            });
        }

        // Expose to window for inline onclick
        window.handleSelect = function(questionIndex, optionIndex) {
            if (isSubmitted) return; // Prevent changing after submit
            currentAnswers[questionIndex] = optionIndex;
            
            // Check if all answered to highlight submit button
            if (currentAnswers.every(ans => ans !== null)) {
                submitBtn.classList.add('animate-pulse');
            }
        };

        function evaluateQuiz() {
            if (isSubmitted) return;
            isSubmitted = true;
            clearInterval(timerInterval);

            // Hide submit btn
            submitContainer.classList.add('hidden');
            
            let score = 0;

            quizData.forEach((q, index) => {
                const selected = currentAnswers[index];
                const isCorrect = selected === q.correct;
                
                const qBlock = document.getElementById(`q-block-${index}`);
                const feedbackDiv = document.getElementById(`feedback-${index}`);
                const statusSpan = document.getElementById(`status-${index}`);

                // Disable all radio buttons
                const radios = document.querySelectorAll(`input[name="q${index}"]`);
                radios.forEach(radio => radio.disabled = true);

                // Style Correct Answer always
                const correctLabel = document.getElementById(`label-q${index}-opt${q.correct}`);
                correctLabel.classList.add('correct-answer');
                
                if (isCorrect) {
                    score++;
                    feedbackDiv.classList.remove('hidden');
                    feedbackDiv.classList.add('bg-green-50', 'border', 'border-green-200');
                    statusSpan.innerHTML = `<i class="fa-solid fa-circle-check text-green-500"></i> <span class="text-green-700">Chính xác! (+1 điểm)</span>`;
                    qBlock.classList.add('border-l-4', 'border-green-500');
                } else {
                    feedbackDiv.classList.remove('hidden');
                    feedbackDiv.classList.add('bg-red-50', 'border', 'border-red-200');
                    
                    if (selected !== null) {
                        // Mark wrong selected
                        const wrongLabel = document.getElementById(`label-q${index}-opt${selected}`);
                        wrongLabel.classList.add('wrong-answer');
                        statusSpan.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-500"></i> <span class="text-red-700">Chưa đúng rồi!</span>`;
                    } else {
                        statusSpan.innerHTML = `<i class="fa-solid fa-circle-exclamation text-yellow-500"></i> <span class="text-yellow-700">Chưa trả lời!</span>`;
                    }
                    qBlock.classList.add('border-l-4', 'border-red-500');
                }
            });

            showResults(score);
        }

        function showResults(score) {
            playSound(soundSuccess);
            
            const percentage = (score / quizData.length) * 100;
            const scoreDisplay = document.getElementById('score-display');
            const feedbackMsg = document.getElementById('feedback-message');
            const scoreIcon = document.getElementById('score-icon');
            
            // Animation for score counting
            let count = 0;
            const duration = 2000;
            const step = Math.max(1, Math.floor(score / (duration / 20))); // Update every 20ms
            
            const counter = setInterval(() => {
                count += step;
                if (count >= score) {
                    count = score;
                    clearInterval(counter);
                }
                scoreDisplay.textContent = count;
            }, 20);

            // Set Feedback based on score
            if (percentage >= 90) {
                feedbackMsg.innerHTML = "Tuyệt đỉnh! Ngữ pháp của bạn quá <strong>Slay</strong>! ✨👑";
                scoreIcon.textContent = "👑";
            } else if (percentage >= 70) {
                feedbackMsg.innerHTML = "Rất tốt! Khá chắc tay rồi đấy, cố gắng chút nữa là hoàn hảo! 🚀";
                scoreIcon.textContent = "🚀";
            } else if (percentage >= 50) {
                feedbackMsg.innerHTML = "Tạm ổn! Cần ôn tập lại các chủ đề bị sai nhé. Cố lên! 💪";
                scoreIcon.textContent = "💪";
            } else {
                feedbackMsg.innerHTML = "Có vẻ bạn cần ôn lại lý thuyết kỹ hơn. Đừng nản, đọc kỹ giải thích nhé! 📚";
                scoreIcon.textContent = "📚";
            }

            // Scroll to top to show results
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Show results screen, hide quiz temporarily
            quizContainer.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
        }

        function autoSubmit() {
            alert("⏰ HẾT GIỜ! Hệ thống sẽ tự động nộp bài của bạn."); // Exception case for auto submit warning. 
            evaluateQuiz();
        }

        window.showExplanation = function(index) {
            const q = quizData[index];
            modalQuestionText.innerHTML = `<strong>Câu ${q.id}:</strong> ${q.question}`;
            modalExplanationContent.innerHTML = `
                <div class="mb-4">
                    <p class="text-sm text-gray-500 mb-1">Đáp án đúng là:</p>
                    <div class="inline-block px-4 py-2 bg-green-100 text-green-800 rounded-lg font-bold border border-green-200">
                        ${['A', 'B', 'C', 'D'][q.correct]}. ${q.options[q.correct]}
                    </div>
                </div>
                <div class="bg-blue-50 border-l-4 border-blue-400 p-4 rounded-r-lg">
                    <h4 class="font-bold text-blue-800 mb-2">Giải thích:</h4>
                    <p class="text-gray-700">${q.explanation}</p>
                </div>
            `;
            explanationModal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        };

        function hideModal() {
            explanationModal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Event Listeners
        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            submitContainer.classList.remove('hidden');
            renderQuestions();
            startTimer();
        });

        submitBtn.addEventListener('click', () => {
            // Check for unanswered questions
            const unanswered = currentAnswers.filter(ans => ans === null).length;
            if (unanswered > 0) {
                const confirmSubmit = confirm(`Bạn còn ${unanswered} câu chưa trả lời. Bạn có chắc chắn muốn nộp bài không?`);
                if (!confirmSubmit) return;
            }
            evaluateQuiz();
        });

        document.getElementById('review-btn').addEventListener('click', () => {
            resultsScreen.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            // User can now scroll through their graded quiz
        });

        closeModalBtn.addEventListener('click', hideModal);
        closeModalBtnBottom.addEventListener('click', hideModal);
        
        // Close modal on click outside
        explanationModal.addEventListener('click', (e) => {
            if (e.target === explanationModal) {
                hideModal();
            }
        });
        
        // Escape key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && explanationModal.classList.contains('active')) {
                hideModal();
            }
        });

    </script>
</body>
</html>
