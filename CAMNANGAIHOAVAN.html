                        {countStr.split('').map((digit, i) => (

                            setIsPlaying(true);

                            console.error("Không thể phát nhạc:", error);

                    p.shortDesc.toLowerCase().includes(lowerTerm)

                                    "Khơi nguồn trí tuệ Việt - Ứng dụng AI hôm nay, Kiến tạo Trạng Nguyên ngày mai."

                            </div>
                            
                            <div className="w-24 h-px bg-[#1a3b75] mx-auto"></div>

                            <div className="font-sans text-sm space-y-1 pt-2 chuvang-body">

                                <p className="font-mono">Phiên bản 02-2026 | Thư viện 20+ Prompt Gốc</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
